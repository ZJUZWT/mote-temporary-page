<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lightmap Algorithm Variants</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10100e;
      --panel: #191915;
      --ink: #e8e2cf;
      --muted: #a39b86;
      --line: #393529;
      --good: #9bcf8e;
      --warn: #d7b56d;
      --bad: #dd766d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(540px, 1fr) 420px;
      gap: 0;
    }

    main {
      padding: 18px;
      border-right: 1px solid var(--line);
    }

    aside {
      padding: 16px;
      overflow: auto;
      max-height: 100vh;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 10px 14px;
      margin-bottom: 14px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    select,
    input[type="range"],
    button {
      accent-color: #d5c179;
    }

    select,
    button {
      background: #242219;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 7px 9px;
      font: inherit;
    }

    button[aria-pressed="true"] {
      border-color: #c8b873;
      color: #f5e9b0;
    }

    .stage {
      display: grid;
      gap: 10px;
    }

    canvas {
      width: 100%;
      image-rendering: pixelated;
      background: #050505;
      border: 1px solid var(--line);
    }

    .caption {
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .textures {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    figure {
      margin: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 8px;
    }

    figure img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      image-rendering: pixelated;
      display: block;
      background: #050505;
    }

    figcaption {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    h1 {
      font-size: 15px;
      margin: 0 0 12px;
      font-weight: 650;
    }

    h2 {
      font-size: 13px;
      margin: 18px 0 8px;
      color: var(--muted);
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 7px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 500;
    }

    tr:last-child td { border-bottom: 0; }

    .loss-good { color: var(--good); }
    .loss-warn { color: var(--warn); }
    .loss-bad { color: var(--bad); }

    .note {
      color: var(--muted);
      margin-top: 10px;
    }

    .hist {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }

    .hist-row {
      display: grid;
      grid-template-columns: 78px 1fr 52px;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .hist-bar {
      height: 8px;
      background: #2a271e;
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .hist-fill {
      display: block;
      height: 100%;
      background: #c8b873;
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      aside { max-height: none; }
      main { border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="app">
    <main>
      <div class="bar">
        <label>
          variant
          <select id="variant"></select>
        </label>
        <label>
          preset
          <select id="preset">
            <option value="review">review mix</option>
            <option value="day">day: window + monitor</option>
            <option value="night">night: lamp + monitor</option>
            <option value="soloWindow">window only</option>
            <option value="soloMonitor">monitor only</option>
            <option value="soloLamp">lamp only</option>
          </select>
        </label>
        <label>
          ambient <span id="ambientValue"></span>
          <input id="ambient" type="range" min="0" max="1" step="0.01">
        </label>
        <label>
          window <span id="windowValue"></span>
          <input id="windowPower" type="range" min="0" max="3" step="0.01">
        </label>
        <label>
          monitor <span id="monitorValue"></span>
          <input id="monitorPower" type="range" min="0" max="3" step="0.01">
        </label>
        <label>
          lamp <span id="lampValue"></span>
          <input id="lampPower" type="range" min="0" max="3" step="0.01">
        </label>
        <label>
          pixel steps
          <select id="quantize">
            <option value="0">off</option>
            <option value="4">4 levels</option>
            <option value="6">6 levels</option>
            <option value="8">8 levels</option>
          </select>
        </label>
        <button id="pixelate" type="button" aria-pressed="true">pixelated</button>
      </div>

      <section class="stage">
        <canvas id="result" width="1024" height="1024"></canvas>
        <div class="caption">
          <span id="summary">loading</span>
          <span>base + packed per-light maps</span>
        </div>
      </section>
    </main>

    <aside>
      <h1>Algorithm Variant Review</h1>
      <div class="textures">
        <figure>
          <img id="windowImg" alt="window influence">
          <figcaption>window influence</figcaption>
        </figure>
        <figure>
          <img id="monitorImg" alt="monitor influence">
          <figcaption>monitor influence</figcaption>
        </figure>
        <figure>
          <img id="lampImg" alt="lamp influence">
          <figcaption>lamp influence</figcaption>
        </figure>
        <figure>
          <img id="packedImg" alt="packed RGB lightmap">
          <figcaption>packed RGB</figcaption>
        </figure>
        <figure>
          <img src="derived-occluder-mask.png" alt="derived occluder">
          <figcaption>derived occluder</figcaption>
        </figure>
        <figure>
          <img src="contact-sheet.png" alt="contact sheet">
          <figcaption>full contact sheet</figcaption>
        </figure>
      </div>

      <h2>zone loss</h2>
      <table>
        <tbody id="lossTable"></tbody>
      </table>

      <h2>variant ranking</h2>
      <table>
        <tbody id="rankingTable"></tbody>
      </table>

      <h2>1x intensity stats</h2>
      <table>
        <tbody id="statsTable"></tbody>
      </table>
      <div id="histogram" class="hist"></div>

      <p class="note">Lower loss is better, but the numbers only reflect the current coarse zones. The image still decides.</p>
    </aside>
  </div>

  <script>
    const paths = {
      base: '../base.png',
      window: 'window-influence.png',
      monitor: 'monitor-influence.png',
      lamp: 'lamp-influence.png',
      packed: 'packed-lightmap-rgb.png'
    };

    const presets = {
      review: { ambient: 0.28, window: 0.95, monitor: 0.75, lamp: 0.80 },
      day: { ambient: 0.34, window: 1.25, monitor: 0.70, lamp: 0.00 },
      night: { ambient: 0.16, window: 0.00, monitor: 0.85, lamp: 1.25 },
      soloWindow: { ambient: 0.18, window: 1.25, monitor: 0.00, lamp: 0.00 },
      soloMonitor: { ambient: 0.18, window: 0.00, monitor: 1.25, lamp: 0.00 },
      soloLamp: { ambient: 0.18, window: 0.00, monitor: 0.00, lamp: 1.35 }
    };

    const els = {
      variant: document.querySelector('#variant'),
      preset: document.querySelector('#preset'),
      ambient: document.querySelector('#ambient'),
      windowPower: document.querySelector('#windowPower'),
      monitorPower: document.querySelector('#monitorPower'),
      lampPower: document.querySelector('#lampPower'),
      quantize: document.querySelector('#quantize'),
      ambientValue: document.querySelector('#ambientValue'),
      windowValue: document.querySelector('#windowValue'),
      monitorValue: document.querySelector('#monitorValue'),
      lampValue: document.querySelector('#lampValue'),
      result: document.querySelector('#result'),
      pixelate: document.querySelector('#pixelate'),
      summary: document.querySelector('#summary'),
      lossTable: document.querySelector('#lossTable'),
      rankingTable: document.querySelector('#rankingTable'),
      statsTable: document.querySelector('#statsTable'),
      histogram: document.querySelector('#histogram'),
      windowImg: document.querySelector('#windowImg'),
      monitorImg: document.querySelector('#monitorImg'),
      lampImg: document.querySelector('#lampImg'),
      packedImg: document.querySelector('#packedImg')
    };

    const ctx = els.result.getContext('2d', { willReadFrequently: true });
    let metrics;
    let current = {};
    let baseData;
    let maps = {};

    function lossClass(value) {
      if (value < 0.08) return 'loss-good';
      if (value < 0.22) return 'loss-warn';
      return 'loss-bad';
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = `${src}?v=${Date.now()}`;
      });
    }

    async function imageData(src) {
      const img = await loadImage(src);
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const imageCtx = canvas.getContext('2d', { willReadFrequently: true });
      imageCtx.drawImage(img, 0, 0);
      return imageCtx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function setPreset(name) {
      const preset = presets[name];
      els.ambient.value = preset.ambient;
      els.windowPower.value = preset.window;
      els.monitorPower.value = preset.monitor;
      els.lampPower.value = preset.lamp;
      render();
    }

    async function loadVariant(name) {
      current.variant = name;
      const base = await imageData(paths.base);
      baseData = base;
      maps.window = await imageData(`${name}/${paths.window}`);
      maps.monitor = await imageData(`${name}/${paths.monitor}`);
      maps.lamp = await imageData(`${name}/${paths.lamp}`);
      els.windowImg.src = `${name}/${paths.window}`;
      els.monitorImg.src = `${name}/${paths.monitor}`;
      els.lampImg.src = `${name}/${paths.lamp}`;
      els.packedImg.src = `${name}/${paths.packed}`;
      render();
      renderTables();
    }

    function channelAt(imageData, index) {
      return imageData.data[index] / 255;
    }

    function render() {
      if (!baseData || !maps.window || !maps.monitor || !maps.lamp) return;
      const width = baseData.width;
      const height = baseData.height;
      els.result.width = width;
      els.result.height = height;
      const out = ctx.createImageData(width, height);
      const ambient = Number(els.ambient.value);
      const windowPower = Number(els.windowPower.value);
      const monitorPower = Number(els.monitorPower.value);
      const lampPower = Number(els.lampPower.value);
      const quantizeSteps = Number(els.quantize.value);

      els.ambientValue.textContent = ambient.toFixed(2);
      els.windowValue.textContent = windowPower.toFixed(2);
      els.monitorValue.textContent = monitorPower.toFixed(2);
      els.lampValue.textContent = lampPower.toFixed(2);

      for (let i = 0; i < out.data.length; i += 4) {
        const w = channelAt(maps.window, i);
        const m = channelAt(maps.monitor, i);
        const l = channelAt(maps.lamp, i);
        let light = ambient + w * windowPower + m * monitorPower + l * lampPower;
        if (quantizeSteps > 0) {
          light = Math.round(light * quantizeSteps) / quantizeSteps;
        }
        const glow = Math.max(w * windowPower, m * monitorPower, l * lampPower);
        for (let c = 0; c < 3; c += 1) {
          const base = baseData.data[i + c];
          out.data[i + c] = Math.min(255, base * light + glow * 38);
        }
        out.data[i + 3] = 255;
      }
      ctx.putImageData(out, 0, 0);
      els.result.style.imageRendering = els.pixelate.getAttribute('aria-pressed') === 'true' ? 'pixelated' : 'auto';
      const loss = metrics.variants[current.variant].zone_loss.overall_loss;
      els.summary.textContent = `${current.variant} / loss ${loss.toFixed(3)}`;
    }

    function metricCell(label, value) {
      return `<tr><th>${label}</th><td class="${lossClass(value)}">${value.toFixed(3)}</td></tr>`;
    }

    function renderTables() {
      const loss = metrics.variants[current.variant].zone_loss;
      els.lossTable.innerHTML = [
        metricCell('overall', loss.overall_loss),
        metricCell('window', loss.window.loss),
        metricCell('monitor', loss.monitor.loss),
        metricCell('lamp', loss.lamp.loss)
      ].join('');

      const ranked = Object.entries(metrics.variants)
        .map(([name, record]) => [name, record.zone_loss.overall_loss])
        .sort((a, b) => a[1] - b[1]);
      els.rankingTable.innerHTML = ranked.map(([name, value]) => {
        const active = name === current.variant ? ' *' : '';
        return `<tr><th>${name}${active}</th><td class="${lossClass(value)}">${value.toFixed(3)}</td></tr>`;
      }).join('');

      const stats = metrics.variants[current.variant].intensity_at_1x;
      els.statsTable.innerHTML = ['window', 'monitor', 'lamp'].map((name) => {
        const item = stats[name];
        return `<tr><th>${name}</th><td>mean ${item.mean.toFixed(3)} / p50 ${item.p50.toFixed(3)} / p90 ${item.p90.toFixed(3)} / p99 ${item.p99.toFixed(3)}</td></tr>`;
      }).join('');

      els.histogram.innerHTML = stats.lamp.histogram.map((bin) => {
        const width = Math.round(bin.fraction * 100);
        return `<div class="hist-row"><span>${bin.range}</span><span class="hist-bar"><span class="hist-fill" style="width:${width}%"></span></span><span>${width}%</span></div>`;
      }).join('');
    }

    async function init() {
      metrics = await fetch(`metrics.json?v=${Date.now()}`).then((res) => res.json());
      const variants = Object.keys(metrics.variants);
      els.variant.innerHTML = variants.map((name) => `<option value="${name}">${name}</option>`).join('');
      els.variant.value = variants.includes('per_light_policy_v2_previous_monitor') ? 'per_light_policy_v2_previous_monitor' : variants[0];
      setPreset('review');
      await loadVariant(els.variant.value);
    }

    els.variant.addEventListener('change', () => loadVariant(els.variant.value));
    els.preset.addEventListener('change', () => setPreset(els.preset.value));
    for (const input of [els.ambient, els.windowPower, els.monitorPower, els.lampPower]) {
      input.addEventListener('input', render);
    }
    els.quantize.addEventListener('change', render);
    els.pixelate.addEventListener('click', () => {
      const next = els.pixelate.getAttribute('aria-pressed') !== 'true';
      els.pixelate.setAttribute('aria-pressed', String(next));
      render();
    });

    init().catch((error) => {
      els.summary.textContent = `failed: ${error.message}`;
      console.error(error);
    });
  </script>
</body>
</html>
