<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Old Survey Station Lightmap Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070808;
        --ink: #d7d4c7;
        --muted: #8d8a7d;
        --line: #2c2c28;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 48% 18%, #171813 0, transparent 34rem),
          linear-gradient(180deg, #050606, var(--bg));
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      main {
        width: min(92vw, 1080px);
        display: grid;
        gap: 14px;
      }

      .scene {
        position: relative;
        width: min(92vw, 1024px);
        aspect-ratio: 1;
        margin-inline: auto;
        overflow: hidden;
        background: #020202;
        outline: 1px solid color-mix(in srgb, var(--line), transparent 10%);
      }

      canvas,
      .fallback,
      .hotspot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .fallback {
        object-fit: contain;
        image-rendering: pixelated;
        opacity: 1;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
      }

      .hotspot {
        border: 0;
        padding: 0;
        background: transparent;
        cursor: crosshair;
      }

      .hotspot::after {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0;
        background: rgb(232 230 205 / 0.24);
        mask-image: var(--mask);
        mask-size: 100% 100%;
        -webkit-mask-image: var(--mask);
        -webkit-mask-size: 100% 100%;
        transition: opacity 220ms var(--ease-out);
      }

      .hotspot:hover::after,
      .hotspot:focus-visible::after {
        opacity: 1;
      }

      .terminal-hotspot {
        --mask: url("masks/terminal-mask.png");
      }

      .window-hotspot {
        --mask: url("masks/window-mask.png");
      }

      .panel {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        letter-spacing: 0;
      }

      label {
        display: grid;
        gap: 5px;
      }

      input,
      select {
        width: 100%;
        accent-color: #d8d0a5;
      }

      select {
        min-height: 28px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: #0c0d0c;
        color: var(--ink);
        font: inherit;
      }

      .caption {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
        letter-spacing: 0;
      }

      .caption strong {
        color: var(--ink);
        font-weight: 500;
      }

      .error {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background: #080909;
        font-size: 13px;
        line-height: 1.7;
        text-align: center;
      }

      @media (max-width: 760px) {
        .panel,
        .caption {
          grid-template-columns: 1fr 1fr;
          flex-direction: column;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hotspot::after {
          transition-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="scene" aria-label="旧勘测站动态 lightmap 实验">
        <img class="fallback" src="base.png" alt="">
        <canvas width="1024" height="1024"></canvas>
        <button class="hotspot terminal-hotspot" aria-label="旧勘测主机"></button>
        <button class="hotspot window-hotspot" aria-label="盐盆观察窗"></button>
      </section>
      <div class="panel" aria-label="lightmap weights">
        <label>ambient <input data-control="ambient" type="range" min="0.18" max="0.52" step="0.01" value="0.30"></label>
        <label>window <input data-control="window" type="range" min="0" max="1.25" step="0.01" value="1.00"></label>
        <label>monitor <input data-control="monitor" type="range" min="0" max="1.15" step="0.01" value="0.86"></label>
        <label>lamps <input data-control="lamps" type="range" min="0" max="1.80" step="0.01" value="1.20"></label>
        <label>view
          <select data-control="view">
            <option value="final">final</option>
            <option value="base">base</option>
            <option value="window">window map</option>
            <option value="monitor">monitor map</option>
            <option value="lamps">lamp map</option>
            <option value="shadow">shadow map</option>
          </select>
        </label>
      </div>
      <div class="caption">
        <span><strong>Lightmap demo</strong> / 每帧按 base、ambient、shadow、window、monitor、lamps 合成；view 可单独检查影响图。</span>
        <span>Scene: CH01 old survey station</span>
      </div>
    </main>

    <script>
      const canvas = document.querySelector("canvas");
      const scene = document.querySelector(".scene");
      const context = canvas.getContext("2d", { willReadFrequently: true });
      const mobileRender = window.matchMedia("(max-width: 820px), (pointer: coarse)").matches;
      const renderSize = mobileRender ? 512 : 1024;
      canvas.width = renderSize;
      canvas.height = renderSize;
      const width = canvas.width;
      const height = canvas.height;
      const pixelCount = width * height;
      const controls = {
        ambient: document.querySelector('[data-control="ambient"]'),
        window: document.querySelector('[data-control="window"]'),
        monitor: document.querySelector('[data-control="monitor"]'),
        lamps: document.querySelector('[data-control="lamps"]'),
        view: document.querySelector('[data-control="view"]'),
      };
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const sources = {
        base: "base.png",
        window: "lightmaps/window-influence.png",
        monitor: "lightmaps/monitor-influence.png",
        lamps: "lightmaps/lamp-influence.png",
        shadow: "lightmaps/shadow-occlusion.png",
      };
      const params = new URLSearchParams(window.location.search);
      const requestedView = params.get("view");
      if (requestedView && Array.prototype.some.call(controls.view.options, (option) => option.value === requestedView)) {
        controls.view.value = requestedView;
      }

      const loadImage = (src) => new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(`Failed to load ${src}`));
        image.src = src;
      });

      function imageData(image) {
        const buffer = document.createElement("canvas");
        buffer.width = width;
        buffer.height = height;
        const bufferContext = buffer.getContext("2d", { willReadFrequently: true });
        bufferContext.imageSmoothingEnabled = false;
        bufferContext.drawImage(image, 0, 0, width, height);
        return bufferContext.getImageData(0, 0, width, height).data;
      }

      function level(value) {
        const levels = [0, 34, 68, 104, 145, 188, 232, 255];
        let best = levels[0];
        let distance = Math.abs(value - best);
        for (const candidate of levels) {
          const nextDistance = Math.abs(value - candidate);
          if (nextDistance < distance) {
            best = candidate;
            distance = nextDistance;
          }
        }
        return best;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function renderFrame(data, startTime, now) {
        const elapsed = reducedMotion ? 0 : (now - startTime) / 1000;
        const view = controls.view.value;
        const ambient = Number(controls.ambient.value);
        const windowWeight = Number(controls.window.value);
        const monitorWeight = Number(controls.monitor.value);
        const lampWeight = Number(controls.lamps.value);

        const windowPulse = reducedMotion
          ? 0.72
          : 0.58 + 0.24 * Math.sin(elapsed * 0.82) + 0.08 * Math.sin(elapsed * 1.73);
        const monitorPulse = reducedMotion
          ? 0.72
          : 0.62 + 0.17 * Math.sin(elapsed * 2.4) + (Math.sin(elapsed * 11.0) > 0.96 ? -0.28 : 0);
        const lampPulse = reducedMotion
          ? 0.5
          : (Math.sin(elapsed * 7.0) > 0.72 ? 1.0 : 0.24) + (Math.sin(elapsed * 17.0) > 0.91 ? 0.55 : 0);
        const scanY = Math.floor((((elapsed * 74) % 430) + 250) * height / 1024);
        const scanBand = 8 * height / 1024;

        const output = context.createImageData(width, height);
        const out = output.data;

        for (let i = 0; i < pixelCount; i += 1) {
          const offset = i * 4;
          const y = Math.floor(i / width);
          if (view !== "final") {
            const source = view === "base" ? data.base : data[view];
            const value = view === "base"
              ? level(source[offset] * 0.299 + source[offset + 1] * 0.587 + source[offset + 2] * 0.114)
              : level(source[offset]);
            out[offset] = value;
            out[offset + 1] = value;
            out[offset + 2] = value;
            out[offset + 3] = 255;
            continue;
          }

          const shadow = data.shadow[offset] / 255;
          const windowLight = data.window[offset] / 255 * windowWeight * windowPulse;
          const monitorLight = data.monitor[offset] / 255 * monitorWeight * monitorPulse;
          const lampLight = data.lamps[offset] / 255 * lampWeight * lampPulse;
          const scan = Math.max(0, 1 - Math.abs(y - scanY) / scanBand) * (data.monitor[offset] / 255) * 0.12;
          const light = windowLight * 0.78 + monitorLight * 0.62 + lampLight * 0.55 + scan;
          const exposure = clamp(ambient * (1 - shadow * 0.32) + light, 0.04, 1.22);

          const sourceLift = windowLight * 16 + monitorLight * 14 + lampLight * 28;
          const luminance = data.base[offset] * 0.299 + data.base[offset + 1] * 0.587 + data.base[offset + 2] * 0.114;
          const value = level(clamp(luminance * exposure + sourceLift, 0, 255));

          out[offset] = value;
          out[offset + 1] = value;
          out[offset + 2] = value;
          out[offset + 3] = 255;
        }

        context.putImageData(output, 0, 0);
        if (!reducedMotion) {
          window.setTimeout(() => {
            requestAnimationFrame((next) => renderFrame(data, startTime, next));
          }, mobileRender ? 100 : 33);
        }
      }

      Promise.all(Object.entries(sources).map(async ([key, src]) => [key, imageData(await loadImage(src))]))
        .then((entries) => {
          const data = {};
          entries.forEach(([key, value]) => {
            data[key] = value;
          });
          if (reducedMotion) {
            renderFrame(data, performance.now(), performance.now());
            Object.values(controls).forEach((control) => {
              control.addEventListener("input", () => renderFrame(data, performance.now(), performance.now()));
              control.addEventListener("change", () => renderFrame(data, performance.now(), performance.now()));
            });
          } else {
            requestAnimationFrame((time) => renderFrame(data, time, time));
          }
        })
        .catch((error) => {
          const box = document.createElement("div");
          box.className = "error";
          box.textContent = error.message;
          scene.append(box);
        });
    </script>
  </body>
</html>
