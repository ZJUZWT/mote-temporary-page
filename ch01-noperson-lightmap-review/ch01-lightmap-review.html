<style>
:root { color-scheme: dark; --bg:#090908; --panel:#161511; --line:#373326; --text:#eee7d5; --muted:#aaa18a; --accent:#d4bd72; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; background:#090908; color:var(--text); font-family:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { position:sticky; top:0; z-index:2; padding:14px 20px; border-bottom:1px solid var(--line); background:rgba(9,9,8,.96); display:grid; gap:8px; }
h1 { margin:0; font-size:22px; letter-spacing:0; }
p { margin:0; color:var(--muted); line-height:1.45; }
main { display:grid; grid-template-columns:minmax(260px,330px) minmax(0,1fr); gap:14px; padding:14px; }
.controls { position:sticky; top:86px; align-self:start; border:1px solid var(--line); background:var(--panel); padding:12px; display:grid; gap:12px; }
label { display:grid; gap:6px; color:var(--muted); font-size:12px; }
select { width:100%; min-height:36px; background:#211f18; color:var(--text); border:1px solid var(--line); padding:0 9px; font:inherit; }
.meta { border-top:1px solid var(--line); padding-top:10px; color:var(--muted); font-size:12px; display:grid; gap:6px; }
.stage { display:grid; gap:12px; }
.hero { min-height:60vh; background:#020202; border:1px solid var(--line); display:grid; place-items:center; overflow:hidden; }
.hero img { width:100%; max-height:82vh; object-fit:contain; display:block; }
.layers { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; }
figure { margin:0; border:1px solid var(--line); background:var(--panel); padding:7px; }
figure img { width:100%; display:block; background:#020202; }
figcaption { padding-top:6px; color:var(--muted); font-size:12px; }
.sheet img { width:100%; display:block; border:1px solid var(--line); }
@media (max-width: 900px) { main { grid-template-columns:1fr; } .controls { position:static; } }
</style>
</head>
