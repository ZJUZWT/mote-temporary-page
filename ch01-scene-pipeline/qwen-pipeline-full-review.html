<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>CH01 Multimodel Scene Review</title>
<style>
:root { color-scheme: dark; --bg:#0b0b09; --panel:#171611; --panel2:#211f18; --line:#3a3629; --text:#efe7d4; --muted:#a9a087; --accent:#d6bf72; --cold:#92aaa5; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:linear-gradient(90deg, rgba(214,191,114,.06) 1px, transparent 1px), linear-gradient(180deg, rgba(146,170,165,.04) 1px, transparent 1px), var(--bg); background-size:48px 48px; color:var(--text); font-family:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { position:sticky; top:0; z-index:4; padding:16px 22px 12px; border-bottom:1px solid var(--line); background:rgba(11,11,9,.96); backdrop-filter:blur(10px); display:grid; gap:10px; }
h1 { margin:0; font-size:24px; letter-spacing:0; }
p { margin:0; color:var(--muted); line-height:1.48; }
main { padding:18px 22px 48px; display:grid; gap:18px; }
.review { display:grid; grid-template-columns:minmax(260px, 340px) minmax(0, 1fr); gap:16px; align-items:start; }
.controls { border:1px solid var(--line); background:var(--panel); padding:14px; display:grid; gap:13px; position:sticky; top:94px; }
label { display:grid; gap:6px; color:var(--muted); font-size:12px; }
select { width:100%; min-height:36px; border:1px solid var(--line); background:var(--panel2); color:var(--text); padding:0 10px; font:inherit; }
.meta { display:grid; gap:7px; padding-top:6px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
.meta strong { color:var(--text); font-weight:600; }
.stage { display:grid; gap:12px; }
.hero { border:1px solid var(--line); background:#050505; min-height:60vh; display:grid; place-items:center; overflow:hidden; }
.hero img { width:100%; height:auto; max-height:82vh; object-fit:contain; display:block; }
.hero img.pixel { image-rendering:pixelated; }
.layers { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; }
figure { margin:0; min-width:0; border:1px solid var(--line); background:var(--panel); padding:8px; }
figure img { width:100%; height:auto; display:block; background:#050505; border:1px solid #2a261c; }
figure img.pixel { image-rendering:pixelated; }
figcaption { padding-top:7px; color:var(--muted); font-size:12px; }
.sheet-wrap { overflow-x:auto; border:1px solid var(--line); background:#050505; }
.sheet-wrap img { width:1040px; max-width:none; display:block; }
a { color:var(--accent); text-decoration:none; }
@media (max-width: 900px) { .review { grid-template-columns:1fr; } .controls { position:static; } .hero { min-height:auto; } }
</style>
</head>
<body>
<header>
  <h1>CH01 Multimodel Scene Review</h1>
  <p>先选生图模型，再选分割模型。灰港使用 space-v2 prompt：airless / black sky / planetary arc / no water / no Earth desert。</p>
</header>
<main>
  <section class='review'>
    <aside class='controls'>
      <label>1. generation model
        <select id='modelSelect'></select>
      </label>
      <label>2. segmentation model
        <select id='segModelSelect'>
          <option value='none'>none / original image</option>
          <option value='sam2'>SAM2 whole-scene proposal</option>
        </select>
      </label>
      <label>3. scene
        <select id='sceneSelect'></select>
      </label>
      <label>4. view
        <select id='viewSelect'>
          <option value='original'>original</option>
          <option value='sam2Overlay'>SAM2 overlay</option>
          <option value='sam2IdMap'>SAM2 id map</option>
          <option value='sam2Proposals'>SAM2 proposal sheet</option>
          <option value='stylizedPixel'>stylized pixel</option>
        </select>
      </label>
      <div class='meta'>
        <div><strong id='modelName'></strong></div>
        <div id='segStats'></div>
        <div id='sceneNote'></div>
      </div>
    </aside>
    <section class='stage'>
      <div class='hero'><img id='heroImage' alt='selected review image'></div>
      <div class='layers' id='layerGrid'></div>
    </section>
  </section>
  <section>
    <h2>All Generation Models</h2>
    <div class='sheet-wrap'><img src='multimodel-generation-contact-sheet.png' alt='all generation models contact sheet'></div>
  </section>
</main>
<script>
const DATA = {"models": [{"id": "qwen-image-2512-fp8", "label": "Qwen Image 2512 fp8"}, {"id": "flux1-dev-fp8", "label": "FLUX.1 dev fp8"}, {"id": "sdxl-turbo", "label": "SDXL Turbo"}, {"id": "sdxl-turbo-pixel-lora", "label": "SDXL Turbo + Pixel LoRA"}], "scenes": [{"id": "IMG-CH01-WAKE-BAY", "slug": "wake-bay", "prompt": "single-person cryogenic wake bay inside an old slow transfer spacecraft in deep space, partial emergency power, opened cryo pod in foreground, manual door control visible, dim status lamps, frost and condensation, narrow service floor, dark inactive ship corners, pressure doors and utility conduits, no windows, lonely low-power spacecraft interior, high resolution concept art, clear object boundaries for segmentation, readable spatial layout, old human-used technology, worn materials, restrained cinematic composition, no readable text, no logo, no watermark", "negative": "clean hospital, luxury capsule, bright clinic, large bridge window, planet surface, crowd, monster, action explosion, low resolution, blurry, waxy, deformed geometry, messy composition, readable letters, watermark, logo, anime, glossy heroic sci-fi, crowded crew, explosion, cheerful poster lighting"}, {"id": "IMG-CH01-NAV-CONSOLE", "slug": "nav-console", "prompt": "old spacecraft navigation console in a compact deep-space control alcove, terminal glow, physical switches and worn keys, signal comparison sheet beside the screen, archive slot, amber warning lamps, pressure hull panels, constrained low-power ship interior, procedural quiet mood, not a panoramic bridge, high resolution concept art, clear object boundaries for segmentation, readable spatial layout, old human-used technology, worn materials, restrained cinematic composition, no readable text, no logo, no watermark", "negative": "huge bridge, transparent hologram spectacle, clean futuristic glass cockpit, city map, cheerful UI, readable final answer, crowd, low resolution, blurry, waxy, deformed geometry, messy compositi -fp8/nav-console/scene-id-map.png", "sam2Proposals": "segmentations/sam2/qwen-image-2512-fp8/nav-console/top-instances-contact-sheet.png", "stylizedPixel": "pixel-stylized/spacev2_nav-console_qwen2512_61011_00001___stylized_320px.png", "sam2RawMaskCount": 220, "sam2KeptCount": 215}, "gray-harbor-landing": {"original": "generations/qwen-image-2512-fp8/gray-harbor-landing/spacev2_gray-harbor-landing_qwen2512_61021_00001_.png", "sam2Overlay": "segmentations/sam2/qwen-image-2512-fp8/gray-harbor-landing/scene-overlay.png", "sam2IdMap": "segmentations/sam2/qwen-image-2512-fp8/gray-harbor-landing/scene-id-map.png", "sam2Proposals": "segmentations/sam2/qwen-image-2512-fp8/gray-harbor-landing/top-instances-contact-sheet.png", "stylizedPixel": "pixel-stylized/spacev2_gray-harbor-landing_qwen2512_61021_00001___stylized_320px.png", "sam2RawMaskCount": 119, "sam2KeptCount": 109}}, "flux1-dev-fp8": {"wake-bay": {"original": "generations/flux1-dev-fp8/wake-bay/spacev2_wake-bay_flux1dev_62001_00001_.png", "sam2Overlay": "segmentations/sam2/flux1-dev-fp8/wake-bay/scene-overlay.png", "sam2IdMap": "segmentations/sam2/flux1-dev-fp8/wake-bay/scene-id-map.png", "sam2Proposals": "segmentations/sam2/flux1-dev-fp8/wake-bay/top-instances-contact-sheet.png", "stylizedPixel": "pixel-stylized/spacev2_wake-bay_flux1dev_62001_00001___stylized_320px.png", "sam2RawMaskCount": 222, "sam2KeptCount": 211}, "nav-console": {"original": "generations/flux1-dev-fp8/nav-console/spacev2_nav-console_flux1dev_62011_00001_.png", "sam2Overlay": "segmentations/sam2/flux1-dev-fp8/nav-console/scene-overlay.png", "sam2IdMap": "segmentations/sam2/flux1-dev-fp8/nav-console/scene-id-map.png", "sam2Proposals": "segmentations/sam2/flux1-dev-fp8/nav-console/top-instances-contact-sheet.png", "stylizedPixel": "pixel-stylized/spacev2_nav-console_flux1dev_62011_00001___stylized_320px.png", "sam2RawMaskCount": 197, "sam2KeptCount": 188}, "gray-harbor-landing": {"original": "generations/flux1-dev-fp8/gray-harbor-landing/spacev2_gray-harbor-landing_flux1dev_62021_00001_.png", "sam2Overlay": "segmentations/sam2/flux1-dev-fp8/gray-harbor-landing/scene-overlay.png", "sam2IdMap": "segmentations/sam2/flux1-dev-fp8/gray-harbor-landing/scene-id-map.png", "sam2Proposals": "segmentations/sam2/flux1-dev-fp8/gray-harbor-landing/top-instances-contact-sheet.png", "stylizedPixel": "pixel-stylized/spacev2_gray-harbor-landing_flux1dev_62021_00001___stylized_320px.png", "sam2RawMaskCount": 89, "sam2KeptCount": 80}}, "sdxl-turbo": {"wake-bay": {"original": "generations/sdxl-turbo/wake-bay/spacev2_wake-bay_sdxlturbo_63001_00001_.png", "sam2Overlay": "segmentations/sam2/sdxl-turbo/wake-bay/scene-overlay.png", "sam2IdMap": "segmentations/sam2/sdxl-turbo/wake-bay/scene-id-map.png", "sam2Proposals": "segmentations/sam2/sdxl-turbo/wake-bay/top-instances-contact-sheet.png", "stylizedPixel": "pixel-stylized/spacev2_wake-bay_sdxlturbo_63001_00001___stylized_320px.png", "sam2RawMaskCount": 166, "sam2KeptCount": 135}, "nav-console": {"original": "generations/sdxl-turbo/nav-console/spacev2_nav-console_sdxlturbo_63011_00001_.png", "sam2Overlay": "segmentations/sam2/sdxl-turbo/nav-console/scene-overlay.png", "sam2IdMap": "segmentations/sam2/sdxl-turbo/nav-console/scene-id-map.png", "sam2Proposals": "segmentations/sam2/sdxl-turbo/nav-console/top-instances-contact-sheet.png", "stylizedPixel": "pixel-stylized/spacev2_nav-console_sdxlturbo_63011_00001___stylized_320px.png", "sam2RawMaskCount": 209, "sam2KeptCount": 175}, "gray-harbor-landing": {"original": "generations/sdxl-turbo/gray-harbor-landing/spacev2_gray-harbor-landing_sdxlturbo_63021_00001_.png", "sam2Overlay": "segmentations/sam2/sdxl-turbo/gray-harbor-landing/scene-overlay.png", "sam2IdMap": "segmentations/sam2/sdxl-turbo/gray-harbor-landing/scene-id-map.png", "sam2Proposals": "segmentations/sam2/sdxl-turbo/gray-harbor-landing/top-instances-contact-sheet.png", "stylizedPixel": "pixel-stylized/spacev2_gray-harbor-landing_sdxlturbo_63021_00001___stylized_320px.png", "sam2RawMaskCount": 131, "sam2KeptCount": 89}}, "sdxl-turbo-pixel-lora": {"wake-bay": {"original": "generations/sdxl-turbo-pixel-lora/wake-bay/spacev2_wake-bay_sdxlpixellora_64001_00001_.png", "sam2Overlay": "segmentations/sam2/sdxl-turbo-pixel-lora/wake-bay/scene-overlay.png", "sam2IdMap": "segmentations/sam2/sdxl-turbo-pixel-lora/wake-bay/scene-id-map.png", "sam2Proposals": "segmentations/sam2/sdxl-turbo-pixel-lora/wake-bay/top-instances-contact-sheet.png", "stylizedPixel": "pixel-stylized/spacev2_wake-bay_sdxlpixellora_64001_00001___stylized_320px.png", "sam2RawMaskCount": 415, "sam2KeptCount": 290}, "nav-console": {"original": "generations/sdxl-turbo-pixel-lora/nav-console/spacev2_nav-console_sdxlpixellora_64011_00001_.png", "sam2Overlay": "segmentations/sam2/sdxl-turbo-pixel-lora/nav-console/scene-overlay.png", "sam2IdMap": "segmentations/sam2/sdxl-turbo-pixel-lora/nav-console/scene-id-map.png", "sam2Proposals": "segmentations/sam2/sdxl-turbo-pixel-lora/nav-console/top-instances-contact-sheet.png", "stylizedPixel": "pixel-stylized/spacev2_nav-console_sdxlpixellora_64011_00001___stylized_320px.png", "sam2RawMaskCount": 335, "sam2KeptCount": 246}, "gray-harbor-landing": {"original": "generations/sdxl-turbo-pixel-lora/gray-harbor-landing/spacev2_gray-harbor-landing_sdxlpixellora_64021_00001_.png", "sam2Overlay": "segmentations/sam2/sdxl-turbo-pixel-lora/gray-harbor-landing/scene-overlay.png", "sam2IdMap": "segmentations/sam2/sdxl-turbo-pixel-lora/gray-harbor-landing/scene-id-map.png", "sam2Proposals": "segmentations/sam2/sdxl-turbo-pixel-lora/gray-harbor-landing/top-instances-contact-sheet.png", "stylizedPixel": "pixel-stylized/spacev2_gray-harbor-landing_sdxlpixellora_64021_00001___stylized_320px.png", "sam2RawMaskCount": 244, "sam2KeptCount": 126}}}, "contactSheet": "multimodel-generation-contact-sheet.png"};
const sceneSelect = document.getElementById('sceneSelect');
const modelSelect = document.getElementById('modelSelect');
const segModelSelect = document.getElementById('segModelSelect');
const viewSelect = document.getElementById('viewSelect');
const heroImage = document.getElementById('heroImage');
const layerGrid = document.getElementById('layerGrid');
const modelName = document.getElementById('modelName');
const segStats = document.getElementById('segStats');
const sceneNote = document.getElementById('sceneNote');

for (const scene of DATA.scenes) {
  const option = document.createElement('option');
  option.value = scene.slug;
  option.textContent = scene.slug;
  sceneSelect.appendChild(option);
}
for (const model of DATA.models) {
  const option = document.createElement('option');
  option.value = model.id;
  option.textContent = model.label || model.id;
  modelSelect.appendChild(option);
}

const layerLabels = [
  ['original', 'original'],
  ['sam2Overlay', 'SAM2 overlay'],
  ['sam2IdMap', 'SAM2 id map'],
  ['sam2Proposals', 'SAM2 proposal sheet'],
  ['stylizedPixel', 'stylized pixel'],
];
function currentRecord() {
  return DATA.records[modelSelect.value]?.[sceneSelect.value];
}
function normalizeView() {
  if (segModelSelect.value === 'none' && ['sam2Overlay','sam2IdMap','sam2Proposals'].includes(viewSelect.value)) {
    viewSelect.value = 'original';
  }
  if (segModelSelect.value === 'sam2' && viewSelect.value === 'original') {
    viewSelect.value = 'sam2Overlay';
  }
}
function render() {
  normalizeView();
  const rec = currentRecord();
  const scene = DATA.scenes.find(item => item.slug === sceneSelect.value);
  const model = DATA.models.find(item => item.id === modelSelect.value);
  if (!rec) return;
  heroImage.src = rec[viewSelect.value] || rec.original;
  heroImage.className = viewSelect.value === 'stylizedPixel' ? 'pixel' : '';
  modelName.textContent = model?.label || modelSelect.value;
  segStats.textContent = rec.sam2KeptCount ? `SAM2 masks: kept ${rec.sam2KeptCount} / raw ${rec.sam2RawMaskCount}` : 'SAM2 masks: not available';
  sceneNote.textContent = scene?.slug === 'gray-harbor-landing' ? 'gray harbor space-v2 prompt rejects water, shoreline, Earth desert, and blue daytime Earth sky.' : 'spacecraft interior prompt uses old low-power ship setting.';
  layerGrid.innerHTML = '';
  for (const [key, label] of layerLabels) {
    const fig = document.createElement('figure');
    const img = document.createElement('img');
    img.src = rec[key];
    if (key === 'stylizedPixel') img.className = 'pixel';
    const cap = document.createElement('figcaption');
    cap.textContent = label;
    fig.appendChild(img);
    fig.appendChild(cap);
    layerGrid.appendChild(fig);
  }
}
[sceneSelect, modelSelect, segModelSelect, viewSelect].forEach(el => el.addEventListener('change', render));
sceneSelect.value = 'gray-harbor-landing';
modelSelect.value = 'qwen-image-2512-fp8';
segModelSelect.value = 'sam2';
viewSelect.value = 'sam2Overlay';
render();
</script>
</body>
</html>
